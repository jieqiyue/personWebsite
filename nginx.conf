     server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  jieqyyy.top;
        root         /usr/share/nginx/html;

        ssl_certificate     /etc/letsencrypt/live/jieqyyy.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jieqyyy.top/privkey.pem;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_prefer_server_ciphers on;

        # --- 添加安全 Headers ---
        # 强制浏览器只使用 HTTPS (HSTS)，max-age 单位为秒 (这里是 6 个月)
        # 首次启用建议 max-age 短一点，确认没问题再加长。
        # 如果你确认所有子域名都使用HTTPS，可以添加 includeSubDomains
        add_header Strict-Transport-Security "max-age=15768000" always;
        # 防止浏览器猜测 MIME 类型
        add_header X-Content-Type-Options "nosniff" always;
        # 防止在 frame 或 iframe 中加载页面 (防止点击劫持)
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 控制 Referer 头的发送策略
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # (可选) 更复杂的 Content-Security-Policy 可以后续添加
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://jieqyyy.top https://giscus.app;" always;
        # -----------------------

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        # --- 添加静态资源缓存配置 ---
        location ~* \\.(css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf|eot)$ {
            # 设置浏览器缓存过期时间为 1 年
            expires 1y;
            # 设置更详细的缓存控制头 (public表示可被代理缓存, immutable表示文件内容不会改变)
            add_header Cache-Control "public, max-age=31536000, immutable";
            # 可选: 关闭这些静态文件的访问日志记录，减少日志量
            access_log off;
            # 尝试提供文件，找不到则404 (避免 fallback 到 index.html)
            try_files $uri =404;
        }
        # --------------------------

        # --- SPA 路由处理 ---
        # 确保这个块在静态资源块之后
        location / {
            try_files $uri $uri/ /index.html;
        }
        # --------------------------

        location /api { # API 代理
                proxy_pass http://host.docker.internal:8080;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
        }

        location /ws { # WebSocket 代理
                proxy_pass http://host.docker.internal:8080;
                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
        }

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
}